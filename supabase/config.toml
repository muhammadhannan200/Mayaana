# Ephemeral test stack only. Never link this configuration to a hosted project.
project_id = "mayaana-auth-tests"

[api]
port = 55431
schemas = ["public"]

[db]
port = 55432
shadow_port = 55430
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
site_url = "http://127.0.0.1:3102"
enable_signup = false

[auth.rate_limit]
token_refresh = 1000
sign_in_sign_ups = 1000

[analytics]
enabled = false

[edge_runtime]
enabled = false
