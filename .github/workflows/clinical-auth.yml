name: Auth E2E on Clinical Implementation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clinical-auth:
    name: Auth E2E (clinical implementation, twice)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # PR #37 remains unmerged by request. Until its tests are on master, use
      # its reviewed, immutable test-only source against THIS checkout's app/SQL.
      - uses: actions/checkout@v4
        if: hashFiles('tests/auth/auth.spec.ts') == ''
        with:
          ref: 7e3657c234b9c446804099043241724c6435e0c6
          path: .auth-fixtures
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/auth/
            /scripts/test-auth.mjs
            /playwright.auth.config.ts
      - name: Use approved Auth test harness if not yet merged
        if: hashFiles('tests/auth/auth.spec.ts') == ''
        run: |
          mkdir -p tests/auth
          cp .auth-fixtures/tests/auth/auth.spec.ts tests/auth/auth.spec.ts
          cp .auth-fixtures/scripts/test-auth.mjs scripts/test-auth.mjs
          cp .auth-fixtures/playwright.auth.config.ts playwright.auth.config.ts
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npx playwright install --with-deps chromium
      - name: First clean Auth run on current clinical app
        run: node scripts/test-auth.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-auth-first
          path: |
            artifacts/auth/
            test-results/
          retention-days: 7
      - name: Second clean Auth run on current clinical app
        id: second
        run: node scripts/test-auth.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.second.outcome != 'skipped'
        with:
          name: clinical-auth-second
          path: |
            artifacts/auth/
            test-results/
          retention-days: 7
