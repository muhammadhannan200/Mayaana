name: UI Audit

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run audit:ui
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-audit-results
          path: |
            artifacts/ui-audit/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
