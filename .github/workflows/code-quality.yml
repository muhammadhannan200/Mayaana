name: Code Quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npm run test:single-active
      - run: npm run test:agenda
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test tests/print-plan/privacy.test.mjs
      - run: node --test tests/clinical/history-display.test.mjs
      - run: node --test tests/measurement-validation.test.mjs tests/arabic-count.test.mjs tests/doctor-week.test.mjs tests/whatsapp.test.mjs tests/password-preflight.test.mjs tests/auth-validation.test.mjs
      - run: npm run build
