name: Clinical DB and RLS

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clinical-db:
    name: Clinical DB/RLS integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Clean replay, live-baseline upgrade, RLS and transaction tests
        run: npm run test:clinical
